<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MMD Shot 💫</title>

    <!-- アプリケーションスクリプト (Babylon.js / babylon-mmd はESMバンドルに含まれる) -->
    <script type="module" src="./src/app.ts"></script>
  </head>
  <body>
    <!-- カスタムローディング画面 -->
    <div id="custom-loading-screen">
      <div class="loading-container">
        <div class="loading-logo">MMD Shot 💫</div>
        <div class="loading-bar-container">
          <div class="loading-bar"></div>
        </div>
        <div class="loading-text">初期化中...</div>
      </div>
    </div>

    <div id="app-container">
      <!-- MMDレンダリングキャンバス -->
      <canvas id="renderCanvas"></canvas>

      <!-- シャッターエフェクト要素 -->
      <div id="shutter-effect" class="shutter-effect"></div>

      <!-- 通知表示エリア -->
      <div id="notification" class="notification">
        <div id="notification-message" class="notification-message"></div>
      </div>

      <!-- カメラUIコントロール -->
      <div class="camera-controls">
        <div id="camera-mode-indicator" class="camera-mode-indicator">カメラ: 自動</div>
        <div id="effect-preset-button" class="effect-preset-button">✨ リッチ</div>
        <div id="capture-button" class="capture-button"></div>
        <div id="camera-mode-button" class="camera-mode-button"></div>
      </div>

      <!-- アセット選択パネル -->
      <div id="asset-panel-button" class="asset-panel-button" title="アセット選択">📁</div>
      <div id="asset-panel" class="asset-panel">
        <div class="asset-panel-title">アセット選択</div>
        <label class="asset-panel-row">
          <span>モデル</span>
          <select id="asset-select-model"></select>
        </label>
        <label class="asset-panel-row">
          <span>モーション</span>
          <select id="asset-select-motion"></select>
        </label>
        <label class="asset-panel-row">
          <span>カメラ</span>
          <select id="asset-select-camera"></select>
        </label>
        <label class="asset-panel-row">
          <span>ステージ</span>
          <select id="asset-select-stage"></select>
        </label>
        <label class="asset-panel-row">
          <span>音楽</span>
          <select id="asset-select-audio"></select>
        </label>
        <div class="asset-panel-actions">
          <button id="asset-panel-close" class="capture-control-button">閉じる</button>
          <button id="asset-panel-apply" class="capture-control-button done">適用</button>
        </div>
      </div>

      <!-- キャプチャ画像表示エリア -->
      <div id="capture-view" class="capture-view">
        <img id="capture-image" class="capture-image" alt="キャプチャ画像" />
        <div class="capture-controls">
          <button id="close-button" class="capture-control-button">キャンセル</button>
          <button id="save-button" class="capture-control-button done">保存</button>
        </div>
      </div>
    </div>
  </body>
</html>
